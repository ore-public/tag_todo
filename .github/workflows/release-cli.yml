name: CLI の npm 公開

# cli-v0.1.0 のようなタグを push したときに公開する。タグのバージョンは packages/cli/package.json と一致させること
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: タグとバージョンが一致するか確認
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "cli-v${version}" = "${GITHUB_REF_NAME}"
      - run: pnpm --filter tagtodo test
      - run: pnpm --filter tagtodo publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
