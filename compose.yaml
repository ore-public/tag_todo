# ローカル開発・テスト用の PostgreSQL（本番の Aurora DSQL の代わり）
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tagtodo
      POSTGRES_PASSWORD: tagtodo
      POSTGRES_DB: tagtodo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tagtodo"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
